name: clip

on:
  push:
    branches: [main]
    paths:
      - "jobs/*.json"
  # Safety net: renders any job still missing from out/ (e.g. if a run was
  # dropped while another run in the shared concurrency group was busy).
  schedule:
    - cron: "15,45 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gtaclips
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -U yt-dlp pillow

      - name: YouTube cookies (optional)
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then printf '%s\n' "$YT_COOKIES" > "$RUNNER_TEMP/yt_cookies.txt"; echo "YT_COOKIES_FILE=$RUNNER_TEMP/yt_cookies.txt" >> "$GITHUB_ENV"; echo "cookies loaded"; else echo "no YT_COOKIES secret"; fi

      - name: Render new jobs
        run: python scripts/render.py

      - name: Commit videos
        run: |
          git config user.name "gtaclips-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out/
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "clip: render $(git diff --cached --name-only | wc -l) video(s)"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
